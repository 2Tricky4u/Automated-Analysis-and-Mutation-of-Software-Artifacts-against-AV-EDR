name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Install Protobuf
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache target directory
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Build
      run: cargo build --verbose --workspace

    - name: Clippy
      run: cargo clippy --workspace -- -D warnings
    
    - name: Run tests
      run: cargo test --verbose --workspace

  # Validate native builds (matches automation/ deployment)
  validate-controller:
    name: Validate Controller (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Install Protobuf
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libprotobuf-dev

    - name: Build Controller binaries
      run: |
        cargo build --release \
          -p controller-scheduler \
          -p controller-selector \
          -p controller-mutator \
          -p controller-triage-engine

    - name: Verify binaries exist
      run: |
        test -f target/release/controller-scheduler
        test -f target/release/controller-selector
        test -f target/release/controller-mutator
        test -f target/release/controller-triage-engine
        echo "✓ All Controller binaries built successfully"

  validate-worker:
    name: Validate Worker (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable-x86_64-pc-windows-msvc
        override: true

    - name: Install Protobuf (Windows)
      run: |
        choco install protoc -y
        refreshenv

    - name: Build Worker binaries
      run: |
        cargo build --release -p worker-agent -p worker-harness

    - name: Verify binaries exist
      run: |
        if (!(Test-Path "target\release\worker-agent.exe")) { throw "worker-agent.exe missing" }
        if (!(Test-Path "target\release\worker-harness.exe")) { throw "worker-harness.exe missing" }
        Write-Host "✓ All Worker binaries built successfully"
