syntax = "proto3";

package automutate.controller;

import "common.proto";

// Controller Service - orchestrates the analysis pipeline
service Controller {
  // Debug: simple ping to test connectivity
  rpc Ping(PingRequest) returns (PingResponse);

  // Schedule a new analysis job
  rpc ScheduleJob(JobRequest) returns (JobResponse);

  // Get job status
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);

  // Submit triage results
  rpc SubmitTriage(TriageRequest) returns (TriageResponse);

  // Query analysis results
  rpc QueryResults(QueryRequest) returns (QueryResponse);

  // Workers push telemetry data here (client-streaming)
  rpc StreamTelemetry(stream automutate.common.TelemetryData) returns (automutate.common.TelemetryAck);

  // Workers report execution status (lightweight heartbeat)
  rpc ReportStatus(StatusReport) returns (StatusAck);

  // Build artifact from template (WSL-side build)
  rpc BuildArtifact(BuildRequest) returns (BuildResponse);

  // Deploy artifact to worker (orchestrates SendArtifact streaming)
  rpc DeployArtifact(DeployRequest) returns (DeployResponse);

  // List workers (scheduler management)
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // NEW: Get detailed job progress (all rounds)
  rpc GetJobProgress(JobProgressRequest) returns (JobProgressResponse);

  // NEW: Manually stop a running job
  rpc StopJob(StopJobRequest) returns (StopJobResponse);

  // NEW: Get round details
  rpc GetRound(GetRoundRequest) returns (GetRoundResponse);

  // NEW: Compare two runs (differential analysis)
  rpc CompareRuns(CompareRunsRequest) returns (CompareRunsResponse);

  // Get trace lines for a run (instrumented execution path)
  rpc GetTraceLines(GetTraceLinesRequest) returns (GetTraceLinesResponse);

  // === MONITORING & ADMIN ENDPOINTS ===

  // Get a specific worker by ID
  rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse);

  // Get available workers (not busy)
  rpc GetAvailableWorkers(GetAvailableWorkersRequest) returns (GetAvailableWorkersResponse);

  // Get enhanced worker metadata (health, tools, detailed info)
  rpc GetWorkerMetadata(GetWorkerMetadataRequest) returns (GetWorkerMetadataResponse);

  // Get pool group metrics
  rpc GetPoolMetrics(GetPoolMetricsRequest) returns (GetPoolMetricsResponse);

  // Get orchestrator status (queue depth, pool count, etc.)
  rpc GetOrchestratorStatus(GetOrchestratorStatusRequest) returns (GetOrchestratorStatusResponse);

  // === ADMIN COMMANDS ===

  // Ping a specific worker (send HealthCheckRequest via stream)
  rpc PingWorker(PingWorkerRequest) returns (PingWorkerResponse);

  // Disconnect a specific worker
  rpc DisconnectWorker(DisconnectWorkerRequest) returns (DisconnectWorkerResponse);

  // Disconnect all workers
  rpc DisconnectAllWorkers(DisconnectAllWorkersRequest) returns (DisconnectAllWorkersResponse);
}

// Selector Service - mutation selection with feedback
service Selector {
  // Get next mutation to try
  rpc SelectMutation(SelectionRequest) returns (SelectionResponse);

  // Report mutation outcome (feedback loop)
  rpc ReportOutcome(OutcomeReport) returns (OutcomeAck);
}

// Triage Service - hypothesis generation
service Triage {
  // Analyze run and generate hypotheses
  rpc AnalyzeRun(AnalysisRequest) returns (AnalysisResponse);

  // Get feature-avoid list
  rpc GetAvoidList(AvoidListRequest) returns (AvoidListResponse);
}

// Debug messages
message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  int64 timestamp = 2;
  string server = 3;
}

// Job scheduling
message JobRequest {
  string name = 1;
  string artifact_type = 2;  // exe, dll, shellcode
  string source = 3;         // Path to payload .bin file (required)
  // NEW: Iterative mutation parameters
  uint32 max_rounds = 6;              // Maximum rounds (default: 10)
  bool stop_on_evasion = 7;           // Stop when not_detected (default: false)
  // Target OS version (e.g., "win10", "win11")
  // If empty, job can run on any available worker
  string target_os = 8;
  // NEW: Required capabilities for worker selection
  // Workers must have ALL listed capabilities (e.g., ["mde"] or ["cortex"])
  // If empty, no capability filtering is applied
  repeated string required_capabilities = 9;
  // NEW: Modular build configuration (uses defaults if not specified)
  ModuleSelection modules = 10;       // Module selection (default: direct/xor_basic/none/...)
  string encoding = 11;               // Payload encoding: "xor" or "english" (default: "xor")
  string trace_mode = 12;             // Instrumented run trace mode (default: "lines"). Valid: "off","api","bb","api+bb","lines","all"
  repeated string variable_categories = 13;  // Which module categories the selector may vary across rounds
  string variation_strategy = 14;             // "mutation" (default) or "full"
  repeated string mutation_pool = 15;         // Mutation IDs to explore (empty = full catalog)
  repeated string mutation_targets = 16;      // Module names to apply mutations to (empty = all)
  repeated string fixed_mutations = 17;       // Always applied after round 1 (empty in request = keep default)
  uint32 sc_checkpoint_count = 18;             // INT3 shellcode checkpoints (0 = disabled, default)
  string selector_type = 19;                   // "coverage" (default) or "fuzzer"
  bool cache_payload = 20;                       // Cache encoded payload across rounds (default: true via handler)
}

message JobResponse {
  automutate.common.JobId job_id = 1;
  bool accepted = 2;
  string message = 3;
  int64 estimated_duration_seconds = 4;
  uint32 max_rounds = 5;  // NEW: Echo max_rounds
}

// Job status query
message JobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;  // queued, building, running, completed, failed
  int32 progress_percent = 3;
  string current_phase = 4;
  repeated string logs = 5;
}

// Triage submission
message TriageRequest {
  string job_id = 1;
  bool detected = 2;
  string av_product = 3;
  string detection_type = 4;
  map<string, string> iocs = 5;
}

message TriageResponse {
  string job_id = 1;
  bool stored = 2;
  string triage_id = 3;
}

// Query results
message QueryRequest {
  repeated string job_ids = 1;
  string date_from = 2;
  string date_to = 3;
  map<string, string> filters = 4;
}

message QueryResponse {
  repeated AnalysisResult results = 1;
  int32 total_count = 2;
}

message AnalysisResult {
  string job_id = 1;
  string artifact_hash = 2;
  bool detected = 3;
  string detection_rate = 4;
  repeated string evasion_techniques = 5;
  map<string, string> telemetry_summary = 6;
}

// Selection messages
message SelectionRequest {
  automutate.common.JobId job_id = 1;
  string round_id = 2;  // NEW: Current round ID

  // NEW: Feedback from previous round (if any)
  FeedbackProto previous_feedback = 3;
}

message SelectionResponse {
  repeated automutate.common.Mutation mutations = 1;
  float exploration_probability = 2;
  string rationale = 3;
}

message OutcomeReport {
  automutate.common.RunId run_id = 1;
  automutate.common.RunResult result = 2;
}

message OutcomeAck {
  bool received = 1;
}

// Triage messages
message AnalysisRequest {
  automutate.common.RunId run_id = 1;
  string elastic_index = 2;  // Query this index for events
}

message AnalysisResponse {
  repeated Hypothesis hypotheses = 1;
  repeated string avoid_features = 2;
}

message Hypothesis {
  int32 rank = 1;
  string description = 2;
  repeated string evidence_fields = 3;
  float confidence = 4;
  string recommendation = 5;  // avoid or seek
}

message AvoidListRequest {
  automutate.common.JobId job_id = 1;
}

message AvoidListResponse {
  repeated string features = 1;
}

// Status reporting (lightweight heartbeat from workers during execution)
message StatusReport {
  string worker_id = 1;
  string worker_ip = 2;
  string job_id = 3;
  string run_id = 4;
  string artifact_name = 5;
  int32 pid = 6;
  int32 elapsed_seconds = 7;
  bool process_alive = 8;
  int32 telemetry_events_count = 9;
  string event_type = 10;  // "started", "heartbeat", "stuck", "terminated", "completed"
  int32 cpu_percent = 11;
  int32 memory_mb = 12;
  string details = 13;
}

message StatusAck {
  bool received = 1;
}

// Build artifact request (Phase 1: Build-Deploy-Execute Pipeline)
message BuildRequest {
  string template_name = 1;  // e.g., "rwx_direct" (legacy mode)
  string source_file = 2;    // e.g., "rwx_direct.c" (legacy mode)
  repeated string compiler_flags = 3;  // Optional custom flags
  repeated automutate.common.Mutation mutations = 4;  // Optional mutations to apply

  // Instrumentation control (maps to build/emitter --trace flag)
  // Values: "off" | "lines" | "api" | "bb" | "api+bb" | "all" | "lines-around-bb=<id>"
  // Default: "api+bb" (if not specified)
  string trace_mode = 5;

  // === MODULAR TEMPLATE BUILD (new preferred mode) ===
  // When modular_build is set, template_name/source_file are ignored
  ModularBuildSpec modular_build = 6;
}

// Modular template build specification
// Uses @MODULE marker system for assembly and @MUTATE markers for AST transforms
message ModularBuildSpec {
  // Module selection for assembly (which modules to combine)
  ModuleSelection modules = 1;

  // Raw payload bytes (will be encoded)
  bytes payload = 2;

  // Payload encoding type: "xor" | "english"
  string encoding = 3;
}

// Module selection for template assembly
// Each field selects which variant to use for that module category
message ModuleSelection {
  // Carrier module: "alloc_rw_rx", "change_rw_rx", "peb_walk"
  string carrier = 1;

  // Decoder module: "xor", "english"
  string decoder = 2;

  // Anti-emulation module: "none", "sirallocalot", "timeraw"
  string antiemulation = 3;

  // Guardrail module: "none", "env"
  string guardrail = 4;

  // VirtualProtect module: "standard", "undersized"
  string virtualprotect = 5;

  // Decoy module: "none", "winexec"
  string decoy = 6;

  // EDR deconditioner module: "none", "alloc_loop"
  string deconditioner = 7;
}

message BuildResponse {
  string artifact_id = 1;    // SHA256 hash of built artifact
  uint64 size_bytes = 2;
  string build_status = 3;   // "success" | "failed"
  string error = 4;
  string storage_path = 5;   // Controller-side path for debugging
  int64 build_timestamp = 6;
  repeated string mutations_applied = 7;  // List of mutation IDs that were applied

  // What instrumentation was actually applied (echoes request.trace_mode or default)
  string trace_mode = 8;
}

// Deploy artifact to worker
message DeployRequest {
  string artifact_id = 1;      // Artifact to deploy
  string worker_address = 2;   // Worker gRPC address (e.g., "10.200.200.11:50052")
}

message DeployResponse {
  bool success = 1;
  string artifact_id = 2;
  string worker_address = 3;
  string worker_storage_path = 4;  // Where worker stored it (e.g., "C:\temp\artifacts\...")
  uint32 chunks_sent = 5;
  string error = 6;
}

// List workers request/response
message ListWorkersRequest {
  // Empty - list all workers
}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message WorkerInfo {
  string worker_id = 1;           // e.g., "win10-worker-01"
  string address = 2;             // e.g., "10.200.200.100:50052"
  string status = 3;              // "available", "busy", "offline"
  string current_job_id = 4;      // Job ID if busy (empty if available)
  int64 last_ping_seconds_ago = 5; // Seconds since last health check
  bool enabled = 6;               // Whether worker is enabled in config

  // NEW FIELDS for dynamic registration
  string os_version = 7;            // "windows10", "windows11", "ubuntu22.04"
  repeated string capabilities = 8; // ["rededr", "defender", "etw", "gpu"]
  map<string, string> metadata = 9; // {"cpu_cores": "8", "ram_gb": "32"}
  automutate.common.ToolVersions tools = 10;          // Tool versions
  string registration_type = 11;    // "static" (TOML) or "dynamic" (RPC)
}

// ===== NEW MESSAGES FOR ITERATIVE LOOP =====

// Job progress (all rounds)
message JobProgressRequest {
  string job_id = 1;
}

message JobProgressResponse {
  string job_id = 1;
  string status = 2;  // "queued", "running", "completed", "failed", "stopped"
  uint32 current_round = 3;
  uint32 max_rounds = 4;
  uint32 progress_percent = 5;
  repeated RoundSummaryProto rounds = 6;
}

message RoundSummaryProto {
  string round_id = 1;
  uint32 round_number = 2;
  repeated string mutations = 3;
  bool detected = 4;
  bool behavior_match = 5;
  double evasion_score = 6;
  string status = 7;
  int64 completed_at = 8;  // Unix timestamp
  string differential_category = 9;  // "real_detection"|"instrumentation_artifact"|"flaky"|"evasion"
  double coverage_percent = 10;
  int32 dry_run_exit_code = 11;      // Exit code from dryrun (clean VM) execution
  bool has_dryrun = 12;              // Whether dryrun result was available for this round
  string detection_verdict = 13;    // verdict string: "detected", "evasion", "ambiguous", etc.
}

// Stop job
message StopJobRequest {
  string job_id = 1;
}

message StopJobResponse {
  bool stopped = 1;
  string message = 2;
}

// Get round details
message GetRoundRequest {
  string job_id = 1;
  string round_id = 2;
}

message GetRoundResponse {
  RoundProto round = 1;
}

message FunctionCoverageProto {
  string name = 1;
  uint32 total_lines = 2;
  uint32 executed_lines = 3;
  double percent = 4;
}

message RoundProto {
  string round_id = 1;
  string job_id = 2;
  uint32 round_number = 3;
  repeated automutate.common.Mutation mutations = 4;
  RunResultProto baseline_run = 5;
  RunResultProto instrumented_run = 6;
  string status = 7;
  BehaviorComparisonProto behavior_match = 8;
  string assembled_source = 9;
  // Coverage fields (computed server-side from trace data)
  double coverage_percent = 20;
  uint32 cutoff_line = 21;
  string cutoff_func = 22;
  // Extended coverage & module data
  repeated FunctionCoverageProto function_coverage = 23;
  ModuleSelection modules = 24;
  uint32 coverage_total_lines = 25;
  uint32 coverage_executable_lines = 26;
  uint32 coverage_executed_lines = 27;
  // Dryrun fields
  RunResultProto dryrun_run = 30;    // Dryrun run result (if available)
  int32 dry_run_exit_code = 31;      // Exit code from dryrun execution
  string detection_verdict = 32;    // verdict string: "detected", "evasion", "ambiguous", etc.
}

message RunResultProto {
  string run_id = 1;
  string job_id = 2;
  string round_id = 3;
  automutate.common.RunType run_type = 4;
  string artifact_id = 5;
  repeated string mutations = 6;
  string outcome = 7;
  bool detected = 8;
  int32 exit_code = 9;
  uint64 telemetry_events_count = 10;
  uint64 elapsed_seconds = 11;
  int64 started_at = 12;
  int64 completed_at = 13;
  string last_checkpoint = 14;
  bool raw_detected = 15;  // original per-run detected before dryrun correction
  string detection_verdict = 16;  // verdict string: "detected", "evasion", "ambiguous", etc.
}

message BehaviorComparisonProto {
  bool outcome_match = 1;
  bool baseline_detected = 2;
  int32 baseline_exit_code = 3;
  bool instrumented_detected = 4;
  int32 instrumented_exit_code = 5;
  repeated string differences = 6;
  double confidence = 7;
  string differential_category = 8;
}

// Compare runs
message CompareRunsRequest {
  string baseline_run_id = 1;
  string instrumented_run_id = 2;
}

message CompareRunsResponse {
  BehaviorComparisonProto comparison = 1;
}

// Feedback for selector (updated SelectionRequest)
message FeedbackProto {
  bool detected = 1;
  repeated string avoid_features = 2;
  repeated string seek_features = 3;
  double evasion_score = 4;
}

// ===== DYNAMIC WORKER REGISTRATION MESSAGES =====
// (WorkerRegistration and ToolVersions moved to common.proto)

// Registration acknowledgment (sent by controller)
message RegistrationAck {
  bool accepted = 1;                      // true if worker registered successfully
  string message = 2;                     // Human-readable status message
  int64 heartbeat_interval_seconds = 3;   // How often worker should send health checks (default: 30)
}

// Worker deregistration (sent by worker on shutdown)
message WorkerDeregistration {
  string worker_id = 1;
  string reason = 2;  // e.g., "shutdown", "scaling_down", "maintenance"
}

// Deregistration acknowledgment
message DeregistrationAck {
  bool success = 1;
  string message = 2;
}

// Worker metadata update (sent by worker when capabilities change)
message WorkerMetadataUpdate {
  string worker_id = 1;
  repeated string capabilities_added = 2;    // New capabilities
  repeated string capabilities_removed = 3;  // Removed capabilities (e.g., RedEDR crashed)
  map<string, string> metadata_updates = 4;  // Updated metadata
  string status = 5;  // "healthy", "degraded", "maintenance"
}

// Metadata update acknowledgment
message MetadataAck {
  bool success = 1;
}

// ===== MONITORING & ADMIN MESSAGES =====

// Get worker by ID
message GetWorkerRequest {
  string worker_id = 1;
}

message GetWorkerResponse {
  WorkerInfo worker = 1;
  bool found = 2;
}

// Get available workers
message GetAvailableWorkersRequest {
  string target_os = 1;  // Optional: filter by OS
  repeated string required_capabilities = 2;  // Optional: filter by capabilities
}

message GetAvailableWorkersResponse {
  repeated WorkerInfo workers = 1;
  int32 total_available = 2;
}

// Get enhanced worker metadata
message GetWorkerMetadataRequest {
  string worker_id = 1;  // If empty, returns all workers
}

message GetWorkerMetadataResponse {
  repeated WorkerMetadataEntry workers = 1;
}

message WorkerMetadataEntry {
  string worker_id = 1;
  string address = 2;
  string status = 3;
  string os_version = 4;
  repeated string capabilities = 5;
  map<string, string> metadata = 6;
  automutate.common.ToolVersions tools = 7;
  int64 last_seen_seconds_ago = 8;
  bool healthy = 9;  // Based on last_seen threshold
  string current_job_id = 10;
  int64 connected_at = 11;  // Unix timestamp when connected
}

// Pool metrics
message GetPoolMetricsRequest {
  string pool_id = 1;  // If empty, returns all pools
}

message GetPoolMetricsResponse {
  repeated PoolMetricsEntry pools = 1;
}

message PoolMetricsEntry {
  string pool_id = 1;
  uint64 total_runs_dispatched = 2;
  uint64 total_runs_completed = 3;
  uint64 total_rounds_completed = 4;
  uint64 total_jobs_completed = 5;
  uint32 current_queue_size = 6;
  uint32 worker_count = 7;
  string current_job_id = 8;
}

// Orchestrator status
message GetOrchestratorStatusRequest {}

message GetOrchestratorStatusResponse {
  uint32 pending_jobs = 1;
  uint32 active_pools = 2;
  uint32 total_workers = 3;
  uint32 available_workers = 4;
  uint32 busy_workers = 5;
  repeated string pool_ids = 6;
  repeated ActiveJobEntry active_jobs = 7;
}

message ActiveJobEntry {
  string job_id = 1;
  string pool_id = 2;
  uint32 current_round = 3;
  uint32 max_rounds = 4;
  string status = 5;
}

// ===== TRACE LINES MESSAGES =====

message GetTraceLinesRequest {
  string run_id = 1;
  uint32 last = 2;  // Return last N trace lines (default: 50)
}

message GetTraceLinesResponse {
  string run_id = 1;
  repeated TraceLine lines = 2;
  uint32 total_events = 3;  // Total trace events in ES for this run
}

message TraceLine {
  uint64 seq = 1;          // payload_seq - execution sequence number
  string file = 2;         // payload_file
  uint32 line = 3;         // payload_line
  string func = 4;         // payload_func
  string code = 5;         // resolved source line (empty initially)
  uint64 ts_us = 6;        // payload_ts_us - timestamp in microseconds
}

// ===== ADMIN COMMAND MESSAGES =====

message PingWorkerRequest {
  string worker_id = 1;
}

message PingWorkerResponse {
  bool success = 1;
  string message = 2;
}

message DisconnectWorkerRequest {
  string worker_id = 1;
  string reason = 2;
}

message DisconnectWorkerResponse {
  bool success = 1;
  string message = 2;
}

message DisconnectAllWorkersRequest {
  string reason = 1;
  bool reconnect_allowed = 2;
}

message DisconnectAllWorkersResponse {
  uint32 disconnected_count = 1;
  string message = 2;
}
