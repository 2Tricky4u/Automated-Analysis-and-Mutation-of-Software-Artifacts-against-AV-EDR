[workspace]
resolver = "2"
members = [
    # Controller components
    "controller/scheduler",
    "controller/builder",
    "controller/queue",
    "controller/selector",
    "controller/mutator",
    "controller/triage-engine",
    "controller/rule-manager",
    "controller/differential-analyzer",
    "controller/triage-client",

    # Worker components
    "worker/agent",
    "worker/harness",
    "worker/harness-ipc",
    "worker/monitor",

    # Build system
    "build/emitter",

    # Telemetry
    "telemetry/collector",

    # UI
    "ui/backend",

    # Shared libraries
    "config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["2Tricky4u"]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tonic = "0.14.2"
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
anyhow = "1.0.100"
thiserror = "2.0.17"
