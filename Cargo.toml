[workspace]
resolver = "2"
members = [
    # Controller
    "controller",

    # Worker components
    "worker/agent",

    # Build system (unified)
    "build",

    # UI
    "ui/backend",

    # Shared libraries
    "common",
    "config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["2Tricky4u"]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tonic = "0.14.2"
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
anyhow = "1.0.100"
thiserror = "2.0.17"
