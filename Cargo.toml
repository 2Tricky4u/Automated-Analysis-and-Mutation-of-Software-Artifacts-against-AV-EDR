[workspace]
resolver = "2"
members = [
    # Controller components
    "controller/scheduler",
    "controller/queue",
    "controller/selector",
    "controller/mutator",
    "controller/triage-engine",
    "controller/rule-manager",
    "controller/differential-analyzer",
    "controller/triage-client",

    # Worker components
    "worker/agent",
    "worker/harness",
    "worker/harness-ipc",
    "worker/monitor",

    # Build system
    "build/emitter",

    # Telemetry
    "telemetry/collector",

    # UI
    "ui/backend",

    # Shared libraries
    "config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EDR Lab Team"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
