filebeat.inputs:
  # ETW Consumer CSV output
  - type: log
    enabled: true
    paths:
      - /logs/etw_events.csv
    fields:
      source: etw
      pipeline: edr-telemetry
    processors:
      - dissect:
          tokenizer: "%{timestamp},%{event_type},%{process_id},%{details}"
          field: "message"
          target_prefix: "etw"

  # Docker container logs
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"

# Output to Elasticsearch
output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
  indices:
    - index: "edr-telemetry-%{+yyyy.MM.dd}"
      when.equals:
        fields.source: "etw"
    - index: "edr-logs-%{+yyyy.MM.dd}"

# Kibana endpoint for dashboards
setup.kibana:
  host: "kibana:5601"

# Index template
setup.template.name: "edr"
setup.template.pattern: "edr-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# Processors
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
