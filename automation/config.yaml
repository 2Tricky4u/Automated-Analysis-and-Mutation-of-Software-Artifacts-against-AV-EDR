# AutoMutate++ Environment Configuration
# Edit this file before running setup-all.ps1

# Network configuration
network:
  switch_name: "IsolationSwitch"
  subnet: "10.200.200.0/24"
  host_ip: "10.200.200.1"
  gateway: "10.200.200.1"
  dns: "10.200.200.1"
  enable_nat: "true"

  # External network support (VPN/RPC machines)
  allow_external: false          # Set to true to enable VPN connectivity
  vpn_gateway: ""                # VPN gateway IP (e.g., "10.0.0.1")
  external_dns: "8.8.8.8"        # DNS for external resolution

  # Optional: Bridge to existing network instead of isolated switch
  # bridge_adapter: ""           # Name of host network adapter to bridge
  # bridge_mode: false           # Set to true to use bridge instead of NAT

# Controller configuration (runs in WSL2)
controller:
  grpc_port: 50051
  elasticsearch_port: 9200
  kibana_port: 5601
  triage_port: 8080

# Elasticsearch configuration
elasticsearch:
  version: "8.11.0"
  memory_gb: 4
  data_path: "/var/lib/elasticsearch"

# Worker VMs configuration (TEMPLATE-BASED)
workers:
  # Windows 10 template
  windows10:
    count: 2                    # Number of Windows 10 VMs to create
    edition: "Pro"
    iso_path: "C:\\ISOs\\Win10_22H2_English_x64v1.iso"
    name_prefix: "win10-worker"
    ip_start: "10.200.200.100"  # First VM: .100, second: .101, etc.
    cpu_count: 2
    memory_gb: 4
    disk_gb: 64

  # Windows 11 template
  windows11:
    count: 2                    # Number of Windows 11 VMs to create
    edition: "Pro"
    iso_path: "C:\\ISOs\\Win11_25H2_English_x64.iso"
    name_prefix: "win11-worker"
    ip_start: "10.200.200.110"  # First VM: .110, second: .111, etc.
    cpu_count: 2
    memory_gb: 6
    disk_gb: 80

# VM storage paths
storage:
  vhd_root: "C:\\HyperV\\VHDs"
  iso_root: "C:\\ISOs"
  backup_root: "D:\\Backups\\AutoMutate"

# Rust toolchain configuration
rust:
  stable_version: "1.75.0"
  nightly_date: "2024-01-15"
  components:
    - "llvm-tools-preview"
    - "rust-src"

# Protobuf configuration
protobuf:
  version: "25.1"

# RedEDR configuration (deployed to workers)
rededr:
  version: "latest"
  api_port: 8080
  data_dir: "C:\\RedEDR\\Data"
  enable_etw: true
  enable_etwti: true
  enable_kernel: true
  enable_dll: true

# Security settings
security:
  disable_enhanced_session: true
  disable_guest_services: true
  enable_mtls: false  # Set to true for production/VPN
  mtls_ca_path: "./certs/ca.crt"
  mtls_cert_path: "./certs/client.crt"
  mtls_key_path: "./certs/client.key"

# External telemetry destinations (Cortex, MDE, etc.)
external_telemetry:
  # Cortex (Prometheus-compatible TSDB)
  cortex:
    enabled: false
    endpoint: ""                # e.g., "https://cortex.vpn:9009/write"
    bearer_token: ""            # API token for authentication
    # OR use mTLS:
    use_mtls: false
    tls_cert_path: ""           # e.g., "./certs/cortex-client.crt"
    tls_key_path: ""            # e.g., "./certs/cortex-client.key"
    tls_ca_path: ""             # e.g., "./certs/cortex-ca.crt"
    batch_size: 1000            # Events per batch
    flush_interval_secs: 10     # Max time before flush

  # Microsoft Defender for Endpoint (MDE)
  mde:
    enabled: false
    endpoint: ""                # e.g., "https://api.securitycenter.microsoft.com"
    tenant_id: ""               # Azure AD tenant ID
    client_id: ""               # App registration client ID
    client_secret: ""           # App registration secret
    # OR use certificate auth:
    use_cert_auth: false
    cert_path: ""               # e.g., "./certs/mde-client.pfx"
    cert_password: ""
    batch_size: 100             # Events per batch
    flush_interval_secs: 30

  # Generic HTTP endpoint (for custom collectors)
  custom_http:
    enabled: false
    endpoint: ""                # e.g., "https://custom-collector.vpn:8443/events"
    method: "POST"              # HTTP method
    headers:                    # Custom headers
      Content-Type: "application/json"
      # Authorization: "Bearer YOUR_TOKEN"
    batch_size: 500
    flush_interval_secs: 15

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARN, ERROR
  log_dir: "./logs"
  max_log_size_mb: 100
  max_log_files: 10

# Advanced settings
advanced:
  enable_unattended_install: false  # Requires autounattend.xml
  enable_snapshot_compression: true
  parallel_vm_creation: 3  # Max workers to create in parallel
  checkpoint_retention_days: 30
