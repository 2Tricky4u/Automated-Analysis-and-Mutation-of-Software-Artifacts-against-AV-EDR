# EDR Lab Configuration Example
# Copy this file to config.yml and customize for your environment

# Controller Configuration
controller:
  host: "0.0.0.0"
  port: 50051
  max_jobs: 100
  job_timeout_seconds: 600

# Worker Configuration
worker:
  id: "worker-01"
  host: "0.0.0.0"
  port: 50052
  controller_url: "http://localhost:50051"
  max_concurrent_jobs: 3
  work_dir: "/tmp/edr-work"

# Build Configuration
build:
  output_dir: "/artifacts"
  cache_dir: "/cache"
  targets:
    - "x86_64-pc-windows-gnu"
    - "x86_64-unknown-linux-gnu"
  
  # Mutation strategies to enable
  mutations:
    - name: "string_obfuscation"
      enabled: true
      level: "medium"
    
    - name: "api_hashing"
      enabled: true
      algorithm: "djb2"
    
    - name: "control_flow_flattening"
      enabled: true
      complexity: "medium"
    
    - name: "junk_code_insertion"
      enabled: false
      percentage: 20
    
    - name: "syscall_direct"
      enabled: true
      target: "windows"

# Telemetry Configuration
telemetry:
  etw:
    enabled: true
    output_format: "csv"
    output_path: "/logs/etw_events.csv"
    buffer_size_kb: 1024
    flush_interval_ms: 1000
    
    providers:
      - name: "Microsoft-Windows-Kernel-Process"
        keywords: "0x10"  # WINEVENT_KEYWORD_PROCESS
      
      - name: "Microsoft-Windows-TCPIP"
        keywords: "0x10"
      
      - name: "Microsoft-Windows-DNS-Client"
        keywords: "0x8000000000000000"
  
  filebeat:
    enabled: true
    elasticsearch_hosts:
      - "http://localhost:9200"
    index_prefix: "edr-telemetry"

# Elasticsearch Configuration
elasticsearch:
  hosts:
    - "http://localhost:9200"
  username: ""  # Leave empty if security is disabled
  password: ""
  index_settings:
    number_of_shards: 1
    number_of_replicas: 0
  
  # Index lifecycle management
  ilm:
    enabled: false
    max_age_days: 30
    max_size_gb: 50

# Kibana Configuration
kibana:
  host: "http://localhost:5601"
  dashboard_import: true
  dashboard_path: "ui/kibana-dashboards/edr-dashboard.ndjson"

# Logging Configuration
logging:
  level: "info"  # trace, debug, info, warn, error
  format: "json"  # json, text
  output: "stdout"  # stdout, file
  file_path: "/logs/edr-lab.log"

# Analysis Configuration
analysis:
  # VMs to use for analysis
  vms:
    - name: "baseline"
      type: "clean"
      snapshot: "baseline-clean"
      
    - name: "defender"
      type: "protected"
      av_product: "Windows Defender"
      snapshot: "defender-enabled"
  
  # Default analysis settings
  defaults:
    timeout_seconds: 300
    enable_etw: true
    enable_procmon: false
    enable_network_capture: true
    
  # Detection thresholds
  detection:
    behavioral_threshold: 5  # Number of suspicious behaviors
    network_threshold: 10    # Number of network connections
    file_threshold: 20       # Number of file operations

# Security Settings
security:
  # Network isolation
  isolated_network: true
  allowed_destinations: []
  
  # Artifact sandboxing
  sandbox:
    enabled: true
    restricted_paths:
      - "C:\\Windows\\System32"
      - "C:\\Program Files"
    
  # Rate limiting
  rate_limit:
    max_jobs_per_hour: 100
    max_builds_per_hour: 50
