syntax = "proto3";

package automutate.common;

// Common types shared across services

message JobId {
  string value = 1;  // Format: job-NNNNNN
}

message ArtifactId {
  string sha256 = 1;
}

message WorkerId {
  string value = 1;  // Format: worker-NN
}

message RunId {
  string uuid = 1;
}

message Timestamp {
  int64 unix_ms = 1;
}

// Mutation specification
message Mutation {
  string id = 1;  // e.g., "ast.import_reshape"
  map<string, string> params = 2;
}

// Labels for run outcomes (CLAUDE.md Section 6)
message RunLabels {
  bool telemetry_seen = 1;
  string alert_level = 2;  // none, low, med, high
  bool blocked = 3;
  int32 detection_latency_ms = 4;
}

// Performance metrics (CLAUDE.md Section 6)
message PerfMetrics {
  float cpu_pct = 1;
  int32 mem_mb = 2;
  int32 event_to_record_ms_p95 = 3;
}

// Canonical RunResult (CLAUDE.md Section 6)
message RunResult {
  RunId run_id = 1;
  ArtifactId artifact_id = 2;
  WorkerId worker_id = 3;
  repeated Mutation mutations = 4;
  Timestamp start_ts = 5;
  Timestamp end_ts = 6;
  string status = 7;  // detected | not_detected | noisy | crash
  RunLabels labels = 8;
  PerfMetrics perf = 9;
  string notes = 10;

  // Telemetry collected during execution (batch, not streamed)
  repeated TelemetryData telemetry_events = 11;
}

// Line-level trace event (Lepori 2023 inspired + binary protocol enhancements)
message TraceEvent {
  uint32 seq = 1;         // Sequence number
  string file = 2;        // Source file path
  uint32 line = 3;        // Line number
  string func = 4;        // Function name
  uint64 ts_us = 5;       // Timestamp (microseconds)
  uint32 thread_id = 6;   // Thread ID (0 for Base64 format, real TID for binary protocol)
}

// Basic-block coverage event (AFL-style)
message CoverageEvent {
  bytes bitmap = 1;              // 64KB AFL-style coverage bitmap
  repeated uint32 bb_ids = 2;    // BB IDs that were executed
  repeated uint32 hit_counts = 3; // Hit count per BB
  uint32 total_bbs = 4;          // Total number of BBs hit
}

// API checkpoint event (WINNIE-style behavioral markers)
message CheckpointEvent {
  string name = 1;        // Checkpoint name (e.g., "api:VirtualAlloc")
  uint64 ts_us = 2;       // Timestamp (microseconds since process start)
}

// Telemetry data streaming (used by workers to push to controller)
message TelemetryData {
  string job_id = 1;
  string event_type = 2;  // etw, procmon, network, trace, coverage, checkpoint
  int64 timestamp = 3;
  bytes payload = 4;
  map<string, string> metadata = 5;

  // Typed payloads for specific event types (one of)
  oneof typed_event {
    TraceEvent trace = 6;
    CoverageEvent coverage = 7;
    CheckpointEvent checkpoint = 8;
  }
}

message TelemetryAck {
  bool received = 1;
  int32 events_count = 2;
}

// Run type for dual-run protocol
enum RunType {
  RUN_TYPE_UNSPECIFIED = 0;
  RUN_TYPE_BASELINE = 1;       // No instrumentation
  RUN_TYPE_INSTRUMENTED = 2;   // Full tracing
}

// ===== Worker/Tool Metadata (shared between controller and worker) =====

// Tool version information
message ToolVersions {
  string rededr_version = 1;     // e.g., "1.2.3" or empty if not installed
  string defender_version = 2;   // e.g., "4.18.2106.1" or empty
  string etw_version = 3;        // e.g., "native" (always available on Windows)
  string llvm_version = 4;       // e.g., "17.0.6" or empty
}

// Worker registration (sent by worker on startup or via bidirectional stream)
message WorkerRegistration {
  string worker_id = 1;             // e.g., "win10-worker-01"
  string ip_address = 2;            // e.g., "10.200.200.100"
  string os_version = 3;            // e.g., "windows10", "windows11"
  repeated string capabilities = 4;  // ["rededr", "defender", "etw", "gpu"]
  map<string, string> metadata = 5;  // {"cpu_cores": "8", "ram_gb": "32"}
  ToolVersions tools = 6;
}

// ===== Artifact Transfer Messages (used by both controller and worker) =====

// Artifact transfer chunk
message ArtifactChunk {
  string artifact_id = 1;     // SHA256 hash
  bytes data = 2;             // Binary chunk (4MB max per message)
  uint32 chunk_index = 3;     // 0-based chunk sequence
  uint32 total_chunks = 4;    // Total number of chunks
  string sha256 = 5;          // Expected SHA256 for verification
}

// Sample execution request
message SampleRequest {
  string job_id = 1;
  string artifact_id = 2;  // Reference to transferred artifact
  int32 timeout_seconds = 3;
  bool enable_etw = 4;
}

// Sample execution response
message SampleResponse {
  string job_id = 1;
  bool success = 2;
  int32 exit_code = 3;
  string output = 4;
  repeated string telemetry_ids = 5;
}

// ===== Bidirectional Stream Messages (Phase 2) =====

// Messages sent from controller to worker via bidirectional stream
message ControllerMessage {
  oneof payload {
    RunSampleCommand run_sample = 1;
    ArtifactChunkBatch artifact_chunks = 2;
    HealthCheckRequest health_check = 3;
    Heartbeat heartbeat = 4;
    Ack ack = 5;
  }
}

// Messages sent from worker to controller via bidirectional stream
message WorkerMessage {
  oneof payload {
    WorkerRegistration registration = 1;       // Sent once on connect
    StatusReport status = 2;                   // Periodic heartbeats
    TelemetryBatch telemetry = 3;             // Stream telemetry events
    SampleResponse sample_response = 4;        // Execution results
    Ack ack = 5;
    ExecutionStatusReport execution_status = 6; // Detailed execution monitoring
  }
}

// Controller command to run sample (via stream)
message RunSampleCommand {
  string request_id = 1;
  SampleRequest request = 2;
}

// Batch of artifact chunks (for streaming large artifacts via bidirectional stream)
message ArtifactChunkBatch {
  string artifact_id = 1;
  repeated ArtifactChunk chunks = 2;
}

// Health check request via stream
message HealthCheckRequest {
  string request_id = 1;
}

// Heartbeat to keep connection alive
message Heartbeat {
  int64 timestamp = 1;
}

// Acknowledgement message
message Ack {
  string request_id = 1;
  bool success = 2;
  string error = 3;
}

// Status report (periodic heartbeat from worker)
message StatusReport {
  string worker_id = 1;
  string worker_ip = 2;
  int32 cpu_percent = 3;
  int32 memory_mb = 4;
  int32 active_jobs = 5;
  string event_type = 6;  // "heartbeat", "job_start", "job_complete"
  string current_job_id = 7;
}

// Detailed execution status report (from ExecutionMonitor during sample execution)
message ExecutionStatusReport {
  string worker_id = 1;
  string worker_ip = 2;
  string job_id = 3;
  string run_id = 4;
  string artifact_name = 5;
  int32 pid = 6;
  int32 elapsed_seconds = 7;
  bool process_alive = 8;
  int32 telemetry_events_count = 9;
  string event_type = 10;  // "started", "heartbeat", "stuck", "approaching_timeout", "terminated"
  int32 cpu_percent = 11;
  int32 memory_mb = 12;
  string details = 13;
}

// Batch of telemetry events
message TelemetryBatch {
  string job_id = 1;
  string run_id = 2;
  repeated TelemetryData events = 3;
  bool is_final = 4;  // True if this is the last batch for this job
}
