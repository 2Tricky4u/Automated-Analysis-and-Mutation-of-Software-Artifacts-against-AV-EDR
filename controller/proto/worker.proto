syntax = "proto3";

package edr.worker;

import "common.proto";

// Worker Agent Service - handles execution tasks
service WorkerAgent {
  // Debug: simple ping to test connectivity
  rpc Ping(PingRequest) returns (PingResponse);

  // Run a sample for analysis
  rpc RunSample(SampleRequest) returns (SampleResponse);

  // Get worker health status
  rpc HealthCheck(HealthRequest) returns (HealthResponse);

  // Receive artifact binary from controller (streaming upload)
  rpc SendArtifact(stream ArtifactChunk) returns (TransferAck);
}

// Harness Service - sample execution with monitoring
service Harness {
  // Execute artifact with timeout and monitoring
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // Monitor execution status
  rpc Monitor(MonitorRequest) returns (stream MonitorEvent);
}

// Debug messages
message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  int64 timestamp = 2;
  string server = 3;
}

// Sample execution request
message SampleRequest {
  string job_id = 1;
  string artifact_id = 2;  // NEW: Reference to transferred artifact (replaces artifact_path)
  int32 timeout_seconds = 3;
  bool enable_etw = 4;
}

message SampleResponse {
  string job_id = 1;
  bool success = 2;
  int32 exit_code = 3;
  string output = 4;
  repeated string telemetry_ids = 5;
}

// Health check
message HealthRequest {
  string worker_id = 1;
}

message HealthResponse {
  string worker_id = 1;
  bool healthy = 2;
  int32 cpu_percent = 3;
  int32 memory_percent = 4;
  int32 active_jobs = 5;
}


// Harness messages
message ExecuteRequest {
  edr.common.JobId job_id = 1;
  string artifact_id = 2;  // NEW: Reference to artifact (replaces artifact_path)
  int32 timeout_seconds = 3;
  repeated string telemetry_providers = 4;
}

message ExecuteResponse {
  edr.common.RunResult result = 1;
  // Full telemetry batch attached to final response
  repeated edr.common.TelemetryData telemetry_events = 2;
}

message MonitorRequest {
  edr.common.RunId run_id = 1;
}

message MonitorEvent {
  string event_type = 1;  // started, running, heartbeat, stuck, crashed, completed
  int64 timestamp = 2;
  string details = 3;

  // Lightweight status info (NOT full telemetry)
  ExecutionStatus status = 4;
}

message ExecutionStatus {
  int32 pid = 1;
  int32 elapsed_seconds = 2;
  bool process_alive = 3;
  int32 cpu_percent = 4;
  int32 memory_mb = 5;
  int32 telemetry_events_count = 6;  // How many events RedEDR has collected so far
  string last_activity = 7;  // Last significant API call or "idle"
}

// Artifact transfer (Phase 1: Build-Deploy-Execute Pipeline)
message ArtifactChunk {
  string artifact_id = 1;     // SHA256 hash
  bytes data = 2;             // Binary chunk (4MB max per message)
  uint32 chunk_index = 3;     // 0-based chunk sequence
  uint32 total_chunks = 4;    // Total number of chunks
  string sha256 = 5;          // Expected SHA256 for verification
}

message TransferAck {
  bool received = 1;
  uint32 chunks_received = 2;
  string error = 3;
  string storage_path = 4;  // Where artifact was written on worker
}
