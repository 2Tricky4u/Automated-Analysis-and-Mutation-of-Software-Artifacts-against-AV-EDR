syntax = "proto3";

package automutate.worker;

import "common.proto";

// Worker Agent Service - handles execution tasks
service WorkerAgent {
  // Debug: simple ping to test connectivity
  rpc Ping(PingRequest) returns (PingResponse);

  // Run a sample for analysis
  rpc RunSample(automutate.common.SampleRequest) returns (automutate.common.SampleResponse);

  // Get worker health status
  rpc HealthCheck(HealthRequest) returns (HealthResponse);

  // Receive artifact binary from controller (streaming upload)
  rpc SendArtifact(stream automutate.common.ArtifactChunk) returns (TransferAck);

  // PHASE 1: Get worker metadata (replaces dynamic registration)
  // Controller calls this to query worker capabilities instead of worker pushing registration
  rpc GetWorkerInfo(WorkerInfoRequest) returns (WorkerInfoResponse);

  // PHASE 1: Pull telemetry from worker (instead of worker streaming to controller)
  // Controller calls this to fetch telemetry instead of worker pushing via StreamTelemetry
  rpc GetTelemetry(TelemetryRequest) returns (stream automutate.common.TelemetryData);

  // PHASE 2: Bidirectional stream for real-time communication
  // Controller initiates connection, both sides can send messages
  // Controller sends: run commands, artifact chunks, health checks, heartbeats
  // Worker sends: registration, status, telemetry, sample results
  rpc EstablishStream(stream automutate.common.ControllerMessage) returns (stream automutate.common.WorkerMessage);
}

// Harness Service - sample execution with monitoring
service Harness {
  // Execute artifact with timeout and monitoring
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // Monitor execution status
  rpc Monitor(MonitorRequest) returns (stream MonitorEvent);
}

// Debug messages
message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  int64 timestamp = 2;
  string server = 3;
}

// (SampleRequest and SampleResponse moved to common.proto)

// Health check
message HealthRequest {
  string worker_id = 1;
}

message HealthResponse {
  string worker_id = 1;
  bool healthy = 2;
  int32 cpu_percent = 3;
  int32 memory_percent = 4;
  int32 active_jobs = 5;
}


// Harness messages
message ExecuteRequest {
  automutate.common.JobId job_id = 1;
  string artifact_id = 2;  // NEW: Reference to artifact (replaces artifact_path)
  int32 timeout_seconds = 3;
  repeated string telemetry_providers = 4;
}

message ExecuteResponse {
  automutate.common.RunResult result = 1;
  // Full telemetry batch attached to final response
  repeated automutate.common.TelemetryData telemetry_events = 2;
}

message MonitorRequest {
  automutate.common.RunId run_id = 1;
}

message MonitorEvent {
  string event_type = 1;  // started, running, heartbeat, stuck, crashed, completed
  int64 timestamp = 2;
  string details = 3;

  // Lightweight status info (NOT full telemetry)
  ExecutionStatus status = 4;
}

message ExecutionStatus {
  int32 pid = 1;
  int32 elapsed_seconds = 2;
  bool process_alive = 3;
  int32 cpu_percent = 4;
  int32 memory_mb = 5;
  int32 telemetry_events_count = 6;  // How many events RedEDR has collected so far
  string last_activity = 7;  // Last significant API call or "idle"
}

// (ArtifactChunk moved to common.proto)

message TransferAck {
  bool received = 1;
  uint32 chunks_received = 2;
  string error = 3;
  string storage_path = 4;  // Where artifact was written on worker
}

// PHASE 1: New messages for controller-initiated queries

// Request worker metadata (empty request - just query current state)
message WorkerInfoRequest {
  // Empty - controller just queries worker's current state
}

// Response with worker metadata (replaces WorkerRegistration push)
message WorkerInfoResponse {
  string worker_id = 1;
  string ip_address = 2;
  string os_version = 3;
  repeated string capabilities = 4;  // ["rededr", "defender", "etw", "gpu"]
  map<string, string> metadata = 5;  // {"cpu_cores": "8", "ram_gb": "32"}
  automutate.common.ToolVersions tools = 6;
  HealthMetrics health = 7;
  string current_job_id = 8;  // Empty if no job running
}

// (ToolVersions moved to common.proto)

// Health metrics
message HealthMetrics {
  int32 cpu_percent = 1;
  int32 memory_percent = 2;
  int32 disk_percent = 3;
  int32 active_jobs = 4;
  int64 uptime_seconds = 5;
}

// Request telemetry from worker (controller pulls instead of worker pushing)
message TelemetryRequest {
  string job_id = 1;             // Get telemetry for this job
  int64 since_timestamp = 2;      // Get events since this time (0 = all)
  int32 max_events = 3;           // Limit number of events (0 = all)
}

// PHASE 2: Bidirectional streaming messages (moved to common.proto)
// - ControllerMessage, WorkerMessage
// - RunSampleCommand, ArtifactChunkBatch, HealthCheckRequest
// - Heartbeat, Ack, WorkerRegistration, StatusReport, TelemetryBatch
