syntax = "proto3";

package edr;

// Worker Agent Service - handles build and execution tasks
service WorkerAgent {
  // Execute a build task on the worker
  rpc ExecuteBuild(BuildRequest) returns (BuildResponse);
  
  // Run a malware sample for analysis
  rpc RunSample(SampleRequest) returns (SampleResponse);
  
  // Get worker health status
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
  
  // Stream telemetry data
  rpc StreamTelemetry(stream TelemetryData) returns (TelemetryAck);
}

// Controller Service - orchestrates the analysis pipeline
service Controller {
  // Schedule a new analysis job
  rpc ScheduleJob(JobRequest) returns (JobResponse);
  
  // Get job status
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);
  
  // Submit triage results
  rpc SubmitTriage(TriageRequest) returns (TriageResponse);
  
  // Query analysis results
  rpc QueryResults(QueryRequest) returns (QueryResponse);
}

// Build task request
message BuildRequest {
  string job_id = 1;
  string source_code = 2;
  string language = 3;  // rust, cpp, csharp
  map<string, string> build_options = 4;
  repeated string mutations = 5;
}

message BuildResponse {
  string job_id = 1;
  bool success = 2;
  string artifact_path = 3;
  string error_message = 4;
  int64 build_time_ms = 5;
}

// Sample execution request
message SampleRequest {
  string job_id = 1;
  string artifact_path = 2;
  int32 timeout_seconds = 3;
  bool enable_etw = 4;
}

message SampleResponse {
  string job_id = 1;
  bool success = 2;
  int32 exit_code = 3;
  string output = 4;
  repeated string telemetry_ids = 5;
}

// Health check
message HealthRequest {
  string worker_id = 1;
}

message HealthResponse {
  string worker_id = 1;
  bool healthy = 2;
  int32 cpu_percent = 3;
  int32 memory_percent = 4;
  int32 active_jobs = 5;
}

// Telemetry data streaming
message TelemetryData {
  string job_id = 1;
  string event_type = 2;  // etw, procmon, network
  int64 timestamp = 3;
  bytes payload = 4;
  map<string, string> metadata = 5;
}

message TelemetryAck {
  bool received = 1;
  int32 events_count = 2;
}

// Job scheduling
message JobRequest {
  string name = 1;
  string artifact_type = 2;  // exe, dll, shellcode
  string source = 3;
  repeated string mutation_strategies = 4;
  int32 priority = 5;
}

message JobResponse {
  string job_id = 1;
  bool accepted = 2;
  string message = 3;
  int64 estimated_duration_seconds = 4;
}

// Job status query
message JobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;  // queued, building, running, completed, failed
  int32 progress_percent = 3;
  string current_phase = 4;
  repeated string logs = 5;
}

// Triage submission
message TriageRequest {
  string job_id = 1;
  bool detected = 2;
  string av_product = 3;
  string detection_type = 4;
  map<string, string> iocs = 5;
}

message TriageResponse {
  string job_id = 1;
  bool stored = 2;
  string triage_id = 3;
}

// Query results
message QueryRequest {
  repeated string job_ids = 1;
  string date_from = 2;
  string date_to = 3;
  map<string, string> filters = 4;
}

message QueryResponse {
  repeated AnalysisResult results = 1;
  int32 total_count = 2;
}

message AnalysisResult {
  string job_id = 1;
  string artifact_hash = 2;
  bool detected = 3;
  string detection_rate = 4;
  repeated string evasion_techniques = 5;
  map<string, string> telemetry_summary = 6;
}
