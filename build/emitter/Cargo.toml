[package]
name = "build-emitter"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
tempfile = "3.10"
uuid = { version = "1.0", features = ["v4"] }

# For AST parsing (Tree-sitter)
tree-sitter = "0.22"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.22"  # C++ parser (also handles C)

# For home directory resolution
dirs = "5.0"

# For Base64 encoding in instrumentation
base64 = "0.22"
