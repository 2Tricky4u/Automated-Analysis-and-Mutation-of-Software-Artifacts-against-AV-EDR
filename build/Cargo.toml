[package]
name = "build"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Local dependencies
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
uuid = { version = "1.0", features = ["v4"] }

# For AST parsing (Tree-sitter)
tree-sitter = "0.26.3"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"

# For home directory resolution
dirs = "6.0.0"

# For Base64 encoding in instrumentation
base64 = "0.22"

# For PE parsing/validation in binary mutations
goblin = "0.9"

# For x86-64 instruction-boundary-aware shellcode patching (INT3 checkpoints)
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "std"] }
