<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Viewer - AutoMutate++</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #16213e;
            border-bottom: 2px solid #0f3460;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .toolbar h1 {
            color: #e94560;
            font-size: 1.1rem;
            white-space: nowrap;
        }

        .toolbar-info {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .toolbar-info strong {
            color: #c9d1d9;
        }

        .toolbar-stats {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
        }

        .toolbar-stats .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        .legend-dot.executed { background: #1a3a1a; border: 1px solid #2d6a2d; }
        .legend-dot.cutoff { background: #3b1d1d; border: 1px solid #8b3a3a; }

        .back-link {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover { text-decoration: underline; }

        /* Error / loading state */
        .status-msg {
            padding: 40px 20px;
            text-align: center;
            color: #8b949e;
            font-size: 1rem;
        }
        .status-msg.error { color: #fca5a5; }

        /* Source container */
        .source-container {
            padding: 0 0 40px 0;
        }

        .source-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .source-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .source-table td {
            padding: 0 12px;
            vertical-align: top;
            white-space: pre;
            border: none;
        }

        /* Line number gutter */
        .source-table td.gutter {
            width: 60px;
            min-width: 60px;
            text-align: right;
            color: #484f58;
            user-select: none;
            cursor: pointer;
            padding-right: 16px;
            border-right: 1px solid #21262d;
        }

        .source-table td.gutter:hover {
            color: #c9d1d9;
        }

        /* Code cell */
        .source-table td.code {
            padding-left: 16px;
        }

        /* Highlighted line (hash navigation) */
        .source-table tr.highlighted td {
            background: rgba(56, 139, 253, 0.15);
        }

        .source-table tr.highlighted td.gutter {
            color: #58a6ff;
            font-weight: bold;
        }

        /* Trace overlay: executed lines */
        .source-table tr.trace-executed td {
            background: rgba(35, 134, 54, 0.12);
        }

        .source-table tr.trace-executed td.gutter {
            color: #3fb950;
        }

        /* Trace overlay: cutoff line */
        .source-table tr.trace-cutoff td {
            background: rgba(218, 54, 51, 0.18);
        }

        .source-table tr.trace-cutoff td.gutter {
            color: #f85149;
            font-weight: bold;
        }

        /* Syntax highlighting */
        .syn-keyword { color: #ff7b72; }
        .syn-type { color: #79c0ff; }
        .syn-preproc { color: #d2a8ff; }
        .syn-string { color: #a5d6ff; }
        .syn-comment { color: #8b949e; font-style: italic; }
        .syn-number { color: #79c0ff; }
        .syn-func { color: #d2a8ff; }

        /* Function Nav Dropdown */
        .func-nav-wrapper {
            position: relative;
        }

        .func-nav-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .func-nav-btn:hover {
            background: #30363d;
            border-color: #484f58;
        }

        .func-nav-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 4px;
            background: #1c2128;
            border: 1px solid #30363d;
            border-radius: 8px;
            min-width: 280px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .func-nav-dropdown.open {
            display: block;
        }

        .func-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #c9d1d9;
            border-bottom: 1px solid #21262d;
        }

        .func-nav-item:last-child {
            border-bottom: none;
        }

        .func-nav-item:hover {
            background: #262c36;
        }

        .func-nav-item .func-name {
            flex: 1;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #d2a8ff;
        }

        .func-nav-item .func-cov {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #8b949e;
            min-width: 90px;
        }

        .func-cov-bar {
            width: 50px;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }

        .func-cov-fill {
            height: 100%;
            border-radius: 3px;
            background: #3fb950;
            transition: width 0.3s;
        }

        /* Function Labels (purple pill on signature line) */
        .func-label {
            display: inline-block;
            background: #6e40c9;
            color: #e6dcfa;
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            margin-right: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            vertical-align: middle;
            line-height: 1.6;
        }

        .func-cov-pct {
            color: #8b949e;
            font-size: 11px;
            margin-right: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            vertical-align: middle;
        }

        /* Fold/Collapse */
        .fold-toggle {
            display: inline-block;
            width: 14px;
            cursor: pointer;
            color: #484f58;
            font-size: 10px;
            transition: transform 0.15s;
            text-align: center;
            user-select: none;
            margin-right: 2px;
        }

        .fold-toggle:hover {
            color: #c9d1d9;
        }

        .fold-toggle.collapsed {
            transform: rotate(-90deg);
        }

        tr.fold-hidden {
            display: none !important;
        }

        tr.fold-summary {
            display: none;
        }

        tr.fold-summary.visible {
            display: table-row;
        }

        tr.fold-summary td {
            text-align: center;
            color: #484f58;
            font-style: italic;
            font-size: 12px;
            padding: 2px 12px;
            background: rgba(110, 64, 201, 0.05);
        }

        /* Function Boundary Lines */
        tr.func-boundary td {
            border-top: 2px solid #30363d;
        }

        /* Enhanced Cutoff Visibility */
        .source-table tr.trace-cutoff td {
            background: rgba(218, 54, 51, 0.25);
        }

        .source-table tr.trace-cutoff {
            animation: cutoff-pulse 2s ease-in-out infinite;
        }

        @keyframes cutoff-pulse {
            0%, 100% { box-shadow: inset 0 0 8px rgba(248, 81, 73, 0.2); }
            50% { box-shadow: inset 0 0 16px rgba(248, 81, 73, 0.45); }
        }

        tr.cutoff-marker td {
            text-align: center;
            padding: 4px 12px;
            background: rgba(218, 54, 51, 0.08);
            border-top: 1px dashed rgba(248, 81, 73, 0.3);
            border-bottom: 1px dashed rgba(248, 81, 73, 0.3);
        }

        .cutoff-marker-label {
            display: inline-block;
            background: #da3633;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 10px;
            letter-spacing: 0.5px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            animation: cutoff-badge-pulse 2s ease-in-out infinite;
        }

        .cutoff-marker-label.checkpoint-ok {
            background: #238636;
        }

        @keyframes cutoff-badge-pulse {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        .checkpoint-tag {
            display: inline-block;
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 2px 10px;
            font-size: 0.75rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <div class="toolbar" id="toolbar">
        <h1>Source Viewer</h1>
        <a class="back-link" href="index.html">Back to Dashboard</a>
        <div class="func-nav-wrapper" id="funcNavWrapper" style="display: none;">
            <button class="func-nav-btn" id="funcNavBtn" onclick="toggleFuncNav()">
                Functions <span id="funcNavCount"></span> &#x25BC;
            </button>
            <div class="func-nav-dropdown" id="funcNavDropdown"></div>
        </div>
        <div class="toolbar-info" id="toolbarInfo">Loading...</div>
        <div class="toolbar-stats" id="toolbarStats" style="display: none;">
            <div class="stat"><span class="legend-dot executed"></span> Executed</div>
            <div class="stat"><span class="legend-dot cutoff"></span> Cutoff</div>
            <div class="stat" id="statExecuted"></div>
            <div class="stat" id="statTotal"></div>
        </div>
    </div>

    <div id="content">
        <div class="status-msg" id="loadingMsg">Loading source...</div>
    </div>

    <script>
        const API_BASE = '';
        const params = new URLSearchParams(window.location.search);
        const jobId = params.get('job_id');
        const roundId = params.get('round_id');
        const runId = params.get('run_id');

        // ================================================================
        // Syntax Highlighting (regex-based, single-line only)
        // ================================================================

        const C_KEYWORDS = new Set([
            'auto', 'break', 'case', 'char', 'const', 'continue', 'default',
            'do', 'double', 'else', 'enum', 'extern', 'float', 'for', 'goto',
            'if', 'inline', 'int', 'long', 'register', 'return', 'short',
            'signed', 'sizeof', 'static', 'struct', 'switch', 'typedef',
            'union', 'unsigned', 'void', 'volatile', 'while',
            'NULL', 'TRUE', 'FALSE', 'WINAPI', 'CALLBACK',
            'PAGE_READWRITE', 'PAGE_READONLY', 'PAGE_EXECUTE_READ',
            'PAGE_EXECUTE_READWRITE', 'PAGE_NOACCESS',
            'MEM_COMMIT', 'MEM_RESERVE', 'MEM_RELEASE',
        ]);

        const C_TYPES = new Set([
            'DWORD', 'BOOL', 'HANDLE', 'LPVOID', 'LPCVOID', 'PVOID',
            'SIZE_T', 'BYTE', 'WORD', 'LONG', 'ULONG', 'UINT', 'INT',
            'HMODULE', 'FARPROC', 'LPARAM', 'WPARAM', 'LRESULT',
            'HWND', 'HINSTANCE', 'LPSTR', 'LPCSTR', 'LPWSTR', 'LPCWSTR',
            'LPTHREAD_START_ROUTINE', 'PAPCFUNC',
            'uint8_t', 'uint16_t', 'uint32_t', 'uint64_t',
            'int8_t', 'int16_t', 'int32_t', 'int64_t',
            'size_t', 'ptrdiff_t', 'uintptr_t', 'intptr_t',
            'PIMAGE_DOS_HEADER', 'PIMAGE_NT_HEADERS', 'PIMAGE_SECTION_HEADER',
            'IMAGE_DOS_HEADER', 'IMAGE_NT_HEADERS', 'IMAGE_SECTION_HEADER',
        ]);

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function highlightLine(line) {
            const escaped = escapeHtml(line);

            // Single-line comments — highlight rest of line
            const commentIdx = escaped.indexOf('//');
            if (commentIdx !== -1) {
                const before = escaped.substring(0, commentIdx);
                const comment = escaped.substring(commentIdx);
                return highlightCode(before) + `<span class="syn-comment">${comment}</span>`;
            }

            // Preprocessor directives
            if (/^\s*#/.test(escaped)) {
                return `<span class="syn-preproc">${escaped}</span>`;
            }

            return highlightCode(escaped);
        }

        function highlightCode(code) {
            // Tokenize and highlight: strings, numbers, identifiers, function calls
            // Process in order: strings first, then the rest
            let result = '';
            let i = 0;

            while (i < code.length) {
                // String literal (already escaped, so quotes are &quot;)
                if (code.startsWith('&quot;', i)) {
                    const end = code.indexOf('&quot;', i + 6);
                    if (end !== -1) {
                        const str = code.substring(i, end + 6);
                        result += `<span class="syn-string">${str}</span>`;
                        i = end + 6;
                        continue;
                    }
                }

                // Char literal
                if (code[i] === "'") {
                    const end = code.indexOf("'", i + 1);
                    if (end !== -1 && end - i <= 6) {
                        const str = code.substring(i, end + 1);
                        result += `<span class="syn-string">${str}</span>`;
                        i = end + 1;
                        continue;
                    }
                }

                // Hex number
                const hexMatch = code.substring(i).match(/^0[xX][0-9a-fA-F]+/);
                if (hexMatch) {
                    result += `<span class="syn-number">${hexMatch[0]}</span>`;
                    i += hexMatch[0].length;
                    continue;
                }

                // Decimal number (not preceded by letter/underscore)
                if (i === 0 || /[^a-zA-Z_]/.test(code[i - 1])) {
                    const numMatch = code.substring(i).match(/^[0-9]+/);
                    if (numMatch) {
                        result += `<span class="syn-number">${numMatch[0]}</span>`;
                        i += numMatch[0].length;
                        continue;
                    }
                }

                // Identifier (keyword / type / function call)
                const idMatch = code.substring(i).match(/^[a-zA-Z_][a-zA-Z0-9_]*/);
                if (idMatch) {
                    const word = idMatch[0];
                    const afterIdx = i + word.length;
                    // Check if followed by '(' → function call
                    const afterChar = afterIdx < code.length ? code[afterIdx] : '';

                    if (C_KEYWORDS.has(word)) {
                        result += `<span class="syn-keyword">${word}</span>`;
                    } else if (C_TYPES.has(word)) {
                        result += `<span class="syn-type">${word}</span>`;
                    } else if (afterChar === '(') {
                        result += `<span class="syn-func">${word}</span>`;
                    } else {
                        result += word;
                    }
                    i += word.length;
                    continue;
                }

                // HTML entity (pass through)
                if (code[i] === '&') {
                    const entityEnd = code.indexOf(';', i);
                    if (entityEnd !== -1 && entityEnd - i < 10) {
                        result += code.substring(i, entityEnd + 1);
                        i = entityEnd + 1;
                        continue;
                    }
                }

                result += code[i];
                i++;
            }

            return result;
        }

        // ================================================================
        // Function Detection (ported from source_resolver.rs)
        // ================================================================

        const FUNC_REJECT_KEYWORDS = new Set([
            'if', 'else', 'for', 'while', 'switch', 'return', 'sizeof', 'typeof', 'defined'
        ]);

        /**
         * Try to extract a function name from a C function signature line.
         * Port of Rust try_parse_func_signature.
         */
        function tryParseFuncSignature(line) {
            const trimmed = line.trim();

            // Skip obvious non-functions
            if (trimmed.startsWith('typedef') ||
                trimmed.startsWith('struct ') ||
                trimmed.startsWith('enum ') ||
                trimmed.startsWith('union ') ||
                trimmed.endsWith(';')) {
                return null;
            }

            // Must contain '(' for a function signature
            const parenPos = trimmed.indexOf('(');
            if (parenPos === -1) return null;

            // The token immediately before '(' is the function name
            const beforeParen = trimmed.substring(0, parenPos);
            const tokens = beforeParen.split(/[^a-zA-Z0-9_]/).filter(s => s.length > 0);
            if (tokens.length === 0) return null;

            const name = tokens[tokens.length - 1];

            // Must have at least one token before the name (the return type)
            const nameStart = beforeParen.lastIndexOf(name);
            const beforeName = beforeParen.substring(0, nameStart).trim();
            if (beforeName.length === 0) return null;

            // Reject keywords
            if (FUNC_REJECT_KEYWORDS.has(name)) return null;

            return name;
        }

        /**
         * Detect C function boundaries by scanning for signatures and tracking braces.
         * Port of Rust detect_functions.
         * Returns array of { name, startLine, endLine } (1-based).
         */
        function detectFunctions(lines) {
            const ranges = [];
            let i = 0;

            while (i < lines.length) {
                const trimmed = lines[i].trim();

                // Skip preprocessor, blank, comments
                if (trimmed.length === 0 ||
                    trimmed.startsWith('#') ||
                    trimmed.startsWith('//') ||
                    trimmed.startsWith('/*')) {
                    i++;
                    continue;
                }

                const name = tryParseFuncSignature(trimmed);
                if (name) {
                    // Find the opening brace (may be on same line or next few lines)
                    let braceLine = i;
                    let foundOpen = trimmed.includes('{');

                    if (!foundOpen) {
                        for (let j = i + 1; j < Math.min(i + 4, lines.length); j++) {
                            if (lines[j].includes('{')) {
                                braceLine = j;
                                foundOpen = true;
                                break;
                            }
                        }
                    }

                    if (foundOpen) {
                        const startLine = i + 1; // 1-based
                        let depth = 0;
                        let endLine = braceLine + 1; // 1-based default

                        for (let k = braceLine; k < lines.length; k++) {
                            for (const ch of lines[k]) {
                                if (ch === '{') {
                                    depth++;
                                } else if (ch === '}') {
                                    depth--;
                                    if (depth === 0) {
                                        endLine = k + 1; // 1-based
                                        break;
                                    }
                                }
                            }
                            if (depth === 0 && k >= braceLine) {
                                endLine = k + 1;
                                break;
                            }
                        }

                        ranges.push({ name, startLine, endLine });
                        i = endLine; // skip past function body (0-based: endLine is 1-based, so this lands on next line)
                        continue;
                    }
                }

                i++;
            }

            return ranges;
        }

        /**
         * Compute per-function coverage from trace data.
         * Returns enriched array with { name, startLine, endLine, totalLines, executedLines, percent }.
         * percent is -1 if no trace data.
         */
        function isExecutableLine(line) {
            const trimmed = line.trim();
            if (trimmed.length === 0) return false;
            if (trimmed.startsWith('#')) return false;
            if (trimmed === '{' || trimmed === '}') return false;
            if (trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('*')) return false;
            return true;
        }

        function computeFunctionCoverage(funcRanges, traceSet, lines) {
            const hasTrace = traceSet && traceSet.size > 0;

            return funcRanges.map(fn => {
                let totalLines = 0;
                let executedLines = 0;

                // Skip signature line (startLine) — matches server-side logic
                for (let l = fn.startLine + 1; l <= fn.endLine; l++) {
                    const text = lines[l - 1] || '';
                    if (!isExecutableLine(text)) continue;
                    totalLines++;
                    if (hasTrace && traceSet.has(l)) executedLines++;
                }

                return {
                    ...fn,
                    totalLines,
                    executedLines,
                    percent: hasTrace ? (totalLines > 0 ? Math.round((executedLines / totalLines) * 100) : 0) : -1
                };
            });
        }

        // ================================================================
        // Interaction: Fold/Collapse & Nav
        // ================================================================

        const foldState = {}; // funcName → boolean (true = collapsed)

        function toggleFold(funcName) {
            foldState[funcName] = !foldState[funcName];
            const collapsed = foldState[funcName];

            // Toggle body rows
            document.querySelectorAll(`tr[data-func-body="${funcName}"]`).forEach(tr => {
                tr.classList.toggle('fold-hidden', collapsed);
            });

            // Toggle summary row
            const summary = document.querySelector(`tr[data-func-summary="${funcName}"]`);
            if (summary) summary.classList.toggle('visible', collapsed);

            // Toggle chevron
            const chevron = document.querySelector(`.fold-toggle[data-func="${funcName}"]`);
            if (chevron) chevron.classList.toggle('collapsed', collapsed);
        }

        function toggleFuncNav() {
            const dropdown = document.getElementById('funcNavDropdown');
            const isOpen = dropdown.classList.toggle('open');

            if (isOpen) {
                // Close on outside click
                setTimeout(() => {
                    document.addEventListener('click', function closeFuncNav(e) {
                        if (!document.getElementById('funcNavWrapper').contains(e.target)) {
                            dropdown.classList.remove('open');
                            document.removeEventListener('click', closeFuncNav);
                        }
                    });
                }, 0);
            }
        }

        function jumpToFunction(lineNum) {
            document.getElementById('funcNavDropdown').classList.remove('open');
            goToLine(lineNum);
            scrollToLine(lineNum);
        }

        // ================================================================
        // Rendering
        // ================================================================

        function renderSource(sourceText, traceLines, lastCheckpoint) {
            const lines = sourceText.split('\n');
            const traceSet = new Set();
            let cutoffLine = -1;

            if (traceLines && traceLines.length > 0) {
                traceLines.forEach(tl => traceSet.add(tl.line));
                // Last line in the sorted trace is the cutoff
                const sorted = [...traceLines].sort((a, b) => a.seq - b.seq);
                cutoffLine = sorted[sorted.length - 1].line;
            }

            // Parse hash for initial highlight
            let hashLine = 0;
            const hashMatch = window.location.hash.match(/^#L(\d+)$/);
            if (hashMatch) hashLine = parseInt(hashMatch[1]);

            // --- Function detection ---
            const funcRanges = detectFunctions(lines);
            const funcCoverage = computeFunctionCoverage(funcRanges, traceSet, lines);

            // Build lookup maps
            const funcStartMap = new Map();   // startLine → funcCov entry
            const funcBoundarySet = new Set();
            const lineToFunc = new Map();     // lineNum → funcName (for body lines, excluding signature)

            funcCoverage.forEach(fn => {
                funcStartMap.set(fn.startLine, fn);
                funcBoundarySet.add(fn.startLine);
                // Body lines: startLine+1 to endLine (signature is startLine itself)
                for (let l = fn.startLine + 1; l <= fn.endLine; l++) {
                    lineToFunc.set(l, fn.name);
                }
            });

            // --- Build HTML ---
            let html = '<div class="source-container"><table class="source-table"><tbody>';

            lines.forEach((line, idx) => {
                const lineNum = idx + 1;
                const classes = [];
                const attrs = [];

                if (lineNum === cutoffLine) {
                    classes.push('trace-cutoff');
                } else if (traceSet.has(lineNum)) {
                    classes.push('trace-executed');
                }

                if (lineNum === hashLine) {
                    classes.push('highlighted');
                }

                if (funcBoundarySet.has(lineNum)) {
                    classes.push('func-boundary');
                }

                // Tag body lines with function name for fold
                if (lineToFunc.has(lineNum)) {
                    attrs.push(`data-func-body="${lineToFunc.get(lineNum)}"`);
                }

                const trClass = classes.length > 0 ? ` class="${classes.join(' ')}"` : '';
                const trAttrs = attrs.length > 0 ? ' ' + attrs.join(' ') : '';

                // Check if this is a function signature line
                const funcEntry = funcStartMap.get(lineNum);

                if (funcEntry) {
                    // Function signature line: add fold chevron + label
                    const covText = funcEntry.percent >= 0
                        ? `<span class="func-cov-pct">${funcEntry.percent}%</span>`
                        : '';

                    html += `<tr id="L${lineNum}"${trClass}${trAttrs}>`;
                    html += `<td class="gutter" onclick="goToLine(${lineNum})">`;
                    html += `<span class="fold-toggle" data-func="${funcEntry.name}" onclick="event.stopPropagation(); toggleFold('${funcEntry.name}')">&#x25BC;</span>`;
                    html += `${lineNum}</td>`;
                    html += `<td class="code"><span class="func-label">${escapeHtml(funcEntry.name)}</span>${covText}${highlightLine(line)}</td>`;
                    html += '</tr>';

                    // Insert fold summary row (hidden by default, shown when collapsed)
                    const bodyCount = funcEntry.endLine - funcEntry.startLine; // lines after signature
                    html += `<tr class="fold-summary" data-func-summary="${funcEntry.name}">`;
                    html += `<td class="gutter"></td>`;
                    html += `<td class="code">... ${bodyCount} lines hidden (${escapeHtml(funcEntry.name)})</td>`;
                    html += '</tr>';
                } else {
                    html += `<tr id="L${lineNum}"${trClass}${trAttrs}>`;
                    html += `<td class="gutter" onclick="goToLine(${lineNum})">${lineNum}</td>`;
                    html += `<td class="code">${highlightLine(line)}</td>`;
                    html += '</tr>';
                }

                // Insert cutoff marker after cutoff line
                if (lineNum === cutoffLine) {
                    const markerAttrs = lineToFunc.has(lineNum)
                        ? ` data-func-body="${lineToFunc.get(lineNum)}"`
                        : (funcStartMap.has(lineNum) ? ` data-func-body="${funcStartMap.get(lineNum).name}"` : '');

                    let cutoffLabel, cutoffClass;
                    if (lastCheckpoint === 'payload_executed' || lastCheckpoint.startsWith('sc_checkpoint')) {
                        cutoffLabel = 'EXECUTION CONTINUED INTO SHELLCODE';
                        cutoffClass = 'cutoff-marker-label checkpoint-ok';
                    } else if (lastCheckpoint === 'Launching') {
                        cutoffLabel = 'EXECUTION STOPPED AT CARRIER LAUNCH (did not enter shellcode)';
                        cutoffClass = 'cutoff-marker-label';
                    } else {
                        cutoffLabel = 'EXECUTION STOPPED HERE';
                        cutoffClass = 'cutoff-marker-label';
                    }

                    html += `<tr class="cutoff-marker"${markerAttrs}>`;
                    html += `<td class="gutter"></td>`;
                    html += `<td class="code"><span class="${cutoffClass}">${cutoffLabel}</span></td>`;
                    html += '</tr>';
                }
            });

            html += '</tbody></table></div>';

            document.getElementById('content').innerHTML = html;

            // Update toolbar
            const checkpointTag = lastCheckpoint
                ? ` &nbsp; <span class="checkpoint-tag">checkpoint: ${escapeHtml(lastCheckpoint)}</span>`
                : '';
            document.getElementById('toolbarInfo').innerHTML =
                `<strong>Round:</strong> ${escapeHtml(roundId || '-')} &nbsp; <strong>Lines:</strong> ${lines.length}${checkpointTag}`;

            // Show trace stats if we have trace data
            if (traceSet.size > 0) {
                document.getElementById('toolbarStats').style.display = 'flex';
                document.getElementById('statExecuted').textContent = `${traceSet.size} executed`;
                document.getElementById('statTotal').textContent = `of ${lines.length} lines`;
            }

            // --- Populate function nav dropdown ---
            if (funcCoverage.length > 0) {
                const navWrapper = document.getElementById('funcNavWrapper');
                const navDropdown = document.getElementById('funcNavDropdown');
                const navCount = document.getElementById('funcNavCount');

                navCount.textContent = `(${funcCoverage.length})`;

                let navHtml = '';
                funcCoverage.forEach(fn => {
                    let covHtml = '';
                    if (fn.percent >= 0) {
                        covHtml = `<div class="func-cov">` +
                            `<div class="func-cov-bar"><div class="func-cov-fill" style="width: ${fn.percent}%"></div></div>` +
                            `<span>${fn.percent}%</span></div>`;
                    }
                    navHtml += `<div class="func-nav-item" onclick="jumpToFunction(${fn.startLine})">` +
                        `<span class="func-name">${escapeHtml(fn.name)}</span>${covHtml}</div>`;
                });

                navDropdown.innerHTML = navHtml;
                navWrapper.style.display = '';
            }

            // Scroll to target
            if (cutoffLine > 0 && !hashMatch) {
                scrollToLine(cutoffLine);
            } else if (hashLine > 0) {
                scrollToLine(hashLine);
            }
        }

        function scrollToLine(lineNum) {
            const row = document.getElementById('L' + lineNum);
            if (row) {
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function goToLine(lineNum) {
            // Remove previous highlight
            const prev = document.querySelector('.source-table tr.highlighted');
            if (prev) prev.classList.remove('highlighted');

            // Add highlight
            const row = document.getElementById('L' + lineNum);
            if (row) row.classList.add('highlighted');

            // Update hash without scrolling
            history.replaceState(null, '', '#L' + lineNum);
        }

        // Handle hash changes
        window.addEventListener('hashchange', () => {
            const match = window.location.hash.match(/^#L(\d+)$/);
            if (match) {
                const line = parseInt(match[1]);
                goToLine(line);
                scrollToLine(line);
            }
        });

        // ================================================================
        // Data Loading
        // ================================================================

        async function loadSource() {
            if (!jobId || !roundId) {
                document.getElementById('loadingMsg').className = 'status-msg error';
                document.getElementById('loadingMsg').textContent =
                    'Missing required URL parameters: job_id and round_id';
                return;
            }

            try {
                // Fetch source via dedicated lightweight endpoint
                const sourceResp = await fetch(`${API_BASE}/api/jobs/${jobId}/rounds/${roundId}/source`);
                const sourceData = await sourceResp.json();
                const src = sourceData.data;

                if (!src || !src.assembled_source) {
                    document.getElementById('loadingMsg').className = 'status-msg error';
                    document.getElementById('loadingMsg').textContent =
                        'No assembled source found for this round';
                    return;
                }

                // Optionally fetch trace data
                let traceLines = null;
                if (runId) {
                    try {
                        const traceResp = await fetch(`${API_BASE}/api/runs/${runId}/trace?last=16000`);
                        const traceData = await traceResp.json();
                        if (traceData.data && traceData.data.lines) {
                            traceLines = traceData.data.lines;
                        }
                    } catch (e) {
                        console.warn('Failed to load trace data:', e);
                    }
                }

                const lastCheckpoint = src.last_checkpoint || '';

                document.title = `Source: ${roundId} - AutoMutate++`;
                renderSource(src.assembled_source, traceLines, lastCheckpoint);

            } catch (e) {
                document.getElementById('loadingMsg').className = 'status-msg error';
                document.getElementById('loadingMsg').textContent =
                    `Error loading source: ${e.message}`;
            }
        }

        loadSource();
    </script>
</body>
</html>
